<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OushodhGhor — অনলাইন মেডিসিন শপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EFF3EC; --paper: #FBFAF6; --ink: #1B2B27; --primary: #1F4B43; --primary-dark: #123128;
  --gold: #B8892E; --brick: #B24438; --steel: #3B6E8F; --line: #D9E0D4; --muted: #5C6B62;
}
html[data-theme="dark"] {
  --bg: #14211C; --paper: #1E2E28; --ink: #ECF2ED; --primary: #3F9678; --primary-dark: #0E1712;
  --gold: #D2A94D; --brick: #E07A6D; --steel: #6FA8CB; --line: #33443D; --muted: #93A69C;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html { background: var(--bg); }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif; transition:background .2s,color .2s; }
a { color:inherit; text-decoration:none; }
button, input, select, textarea { font-family:inherit; }
.container { max-width:1120px; margin:0 auto; padding:0 16px; }

.site-header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; background:var(--paper); border-bottom:1px solid var(--line); }
.header-row { display:flex; align-items:center; gap:10px; padding:12px 16px; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-badge { width:40px; height:40px; border-radius:999px; background:var(--primary); display:grid; place-items:center; font-size:18px; flex-shrink:0; }
.logo-text { font-family:'Tiro Bangla',serif; font-size:24px; color:var(--primary); }
.spacer { flex:1; }
.icon-btn { position:relative; width:38px; height:38px; border-radius:999px; border:1px solid var(--line); background:var(--paper); color:var(--muted); display:grid; place-items:center; cursor:pointer; font-size:15px; }
.cart-btn { background:var(--primary); border:none; color:#fff; }
.badge { position:absolute; top:-4px; right:-4px; background:var(--brick); color:#fff; font-size:11px; font-weight:700; border-radius:999px; min-width:18px; height:18px; display:grid; place-items:center; padding:0 4px; }
.search-wrap { margin:12px 0 10px; }
.search-input { width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px; }
.category-chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; }
.chip { flex-shrink:0; white-space:nowrap; padding:8px 14px; border-radius:999px; font-size:13.5px; font-weight:500; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
.chip.active { background:var(--primary); color:#fff; border-color:transparent; }

.main-content { padding:4px 16px 60px; }
.page-title { font-family:'Tiro Bangla',serif; font-size:26px; color:var(--primary); margin:18px 0; }
.empty-state { text-align:center; padding:60px 16px; color:var(--muted); }

.product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; }
.product-card { position:relative; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px 14px 14px; display:flex; flex-direction:column; gap:8px; }
.notch { position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:18px; height:18px; border-radius:999px; background:var(--bg); border:1px solid var(--line); }
.product-image-wrap { position:relative; }
.product-image { width:100%; aspect-ratio:4/3; border-radius:10px; display:grid; place-items:center; overflow:hidden; }
.product-image img { width:100%; height:100%; object-fit:cover; }
.cat-emoji { font-size:26px; }
.stock-badge { position:absolute; top:8px; right:8px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--paper); }
.stock-badge.out { color:var(--brick); }
.stock-badge.low { color:var(--gold); }
.product-name { font-size:14.5px; font-weight:600; line-height:1.35; min-height:38px; }
.product-desc { font-size:12.5px; color:var(--muted); }
.price { font-size:17px; font-weight:700; color:var(--primary); font-family:'JetBrains Mono',monospace; }
.card-action { border-top:1px dashed var(--line); padding-top:10px; margin-top:auto; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-size:13.5px; }
.btn-block { width:100%; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-outline { background:none; border:1px solid var(--line); color:var(--ink); }
.btn-disabled { background:var(--line); color:var(--muted); cursor:not-allowed; }
.btn-whatsapp { background:#25D366; color:#fff; }
.btn-danger { background:var(--brick); color:#fff; }
.btn-sm { padding:6px 12px; font-size:12px; }

.qty-control { display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:5px 8px; }
.qty-btn { width:28px; height:28px; border-radius:8px; border:none; background:var(--paper); cursor:pointer; font-size:15px; font-weight:700; color:var(--ink); }
.qty-btn.primary { background:var(--primary); color:#fff; }

.cart-backdrop { position:fixed; inset:0; background:rgba(15,26,22,.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s; }
.cart-backdrop.open { opacity:1; pointer-events:auto; }
.cart-drawer { position:fixed; top:0; right:0; height:100%; width:min(400px,100%); background:var(--paper); box-shadow:-10px 0 30px rgba(0,0,0,.12); transform:translateX(100%); transition:transform .28s ease; z-index:51; display:flex; flex-direction:column; }
.cart-drawer.open { transform:translateX(0); }
.cart-head { padding:18px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
.cart-body { flex:1; overflow-y:auto; padding:16px; }
.cart-item { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
.cart-item-thumb { width:36px; height:36px; border-radius:9px; overflow:hidden; flex-shrink:0; display:grid; place-items:center; }
.cart-item-thumb img { width:100%; height:100%; object-fit:cover; }
.cart-item-info { flex:1; min-width:0; }
.cart-item-name { font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cart-item-price { font-size:12.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; }
.cart-foot { padding:16px; border-top:1px solid var(--line); }

.checkout-grid { display:grid; grid-template-columns:1.2fr 1fr; gap:24px; }
.form-card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:14px; }
.form-group { display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:600; color:var(--muted); }
.form-input { width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:14px; }
textarea.form-input { min-height:80px; resize:vertical; }
.order-summary { background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:18px; height:fit-content; }
.order-summary h3 { font-family:'Tiro Bangla',serif; font-size:17px; color:var(--primary); margin:0 0 12px; }
.summary-row { display:flex; justify-content:space-between; font-size:13.5px; color:var(--muted); margin-bottom:8px; }
.summary-total { display:flex; justify-content:space-between; border-top:1px dashed var(--line); margin-top:10px; padding-top:10px; font-weight:700; color:var(--ink); }
.alert-error { color:var(--brick); font-size:13px; background:rgba(178,68,56,.08); padding:10px 12px; border-radius:8px; }
.alert-success { color:var(--primary); font-size:13px; background:rgba(31,75,67,.08); padding:10px 12px; border-radius:8px; }

.confirm-box, .login-box { max-width:460px; margin:30px auto; text-align:center; }
.confirm-icon { width:64px; height:64px; border-radius:999px; background:var(--primary); color:#fff; display:grid; place-items:center; margin:0 auto 18px; font-size:28px; }
.order-id { font-size:18px; font-weight:700; margin-bottom:20px; font-family:'JetBrains Mono',monospace; }
.muted { color:var(--muted); font-size:14px; }
.hint { font-size:12px; color:var(--muted); }

.admin-header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; background:var(--primary-dark); color:#fff; }
.admin-toprow { max-width:1120px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:10px; }
.admin-nav { max-width:1120px; margin:0 auto; padding:0 16px; display:flex; gap:4px; overflow-x:auto; }
.admin-nav button { padding:10px 16px; background:none; border:none; border-bottom:2px solid transparent; color:rgba(255,255,255,.6); cursor:pointer; font-size:14px; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.admin-nav button.active { color:#fff; border-bottom-color:#fff; font-weight:600; }
.admin-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.order-card, .product-row { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
.order-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
.order-body { border-top:1px dashed var(--line); padding-top:10px; font-size:13.5px; display:flex; flex-direction:column; gap:6px; }
.status-select { border-radius:999px; padding:5px 10px; font-size:12.5px; font-weight:600; background:var(--paper); }
.status-pending { color:var(--gold); border:1px solid var(--gold); }
.status-processing { color:var(--steel); border:1px solid var(--steel); }
.status-delivered { color:var(--primary); border:1px solid var(--primary); }
.status-cancelled { color:var(--brick); border:1px solid var(--brick); }
.status-shipped { color:#8B6FD0; border:1px solid #8B6FD0; }
.track-box { max-width:560px; margin:10px auto; }
.timeline { display:flex; flex-direction:column; margin:16px 0; }
.tl-step { display:flex; gap:12px; position:relative; padding-bottom:22px; }
.tl-step:last-child { padding-bottom:0; }
.tl-step::before { content:""; position:absolute; left:12px; top:26px; bottom:0; width:2px; background:var(--line); }
.tl-step:last-child::before { display:none; }
.tl-dot { width:26px; height:26px; border-radius:999px; border:2px solid var(--line); background:var(--paper); display:grid; place-items:center; font-size:13px; flex-shrink:0; z-index:1; color:#fff; }
.tl-step.done .tl-dot { background:var(--primary); border-color:var(--primary); }
.tl-step.done::before { background:var(--primary); }
.tl-step.current .tl-dot { box-shadow:0 0 0 4px rgba(63,150,120,.25); }
.tl-label { font-weight:600; font-size:14px; }
.tl-step.todo .tl-label { color:var(--muted); font-weight:500; }
.tl-sub { font-size:12px; color:var(--muted); }
.confirm-inline { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:rgba(178,68,56,.1); border:1px solid var(--brick); border-radius:8px; padding:8px 10px; margin-top:10px; }
.confirm-inline span { font-size:12.5px; color:var(--brick); font-weight:600; flex:1 1 auto; }
.product-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.thumb { width:38px; height:38px; border-radius:9px; overflow:hidden; display:grid; place-items:center; flex-shrink:0; }
.thumb img { width:100%; height:100%; object-fit:cover; }
.input-sm { padding:6px 8px; border-radius:7px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:13px; width:100%; }
.file-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--ink); cursor:pointer; font-size:12.5px; }
.add-form { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--primary-dark); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:60; }

.site-footer { border-top:1px solid var(--line); padding:22px 16px; text-align:center; color:var(--muted); font-size:14px; }
.site-footer strong { color:var(--primary); }

@media (max-width:720px) {
  .checkout-grid { grid-template-columns:1fr; }
  .add-form { grid-template-columns:1fr; }
  .logo-text { font-size:20px; }
}
</style>

/* ---------------- helpers ---------------- */
function escapeHtml(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, function(s){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s];
  });
}
function taka(n){
  try { return "৳" + Number(n || 0).toLocaleString("bn-BD"); }
  catch(e){ return "৳" + (n || 0); }
}
function bnDate(iso){
  try { return new Date(iso).toLocaleString("bn-BD", { dateStyle:"medium", timeStyle:"short" }); }
  catch(e){ return iso; }
}
function cartItemsList(){
  var items = [];
  Object.keys(state.cart).forEach(function(id){
    var p = state.products.find(function(x){ return x.id === id; });
    if (p) items.push(Object.assign({}, p, { qty: state.cart[id] }));
  });
  return items;
}
function cartCount(){
  return Object.values(state.cart).reduce(function(s,q){ return s+q; }, 0);
}
function cartTotal(){
  return cartItemsList().reduce(function(s,i){ return s + i.price*i.qty; }, 0);
}
function pendingCount(){
  return state.orders.filter(function(o){ return o.status === "pending"; }).length;
}
function filteredProducts(){
  var q = state.search.trim().toLowerCase();
  return state.products.filter(function(p){
    var matchCat = state.activeCategory === "all" || p.category === state.activeCategory;
    var matchSearch = !q || p.name.toLowerCase().indexOf(q) !== -1 || p.desc.toLowerCase().indexOf(q) !== -1;
    return matchCat && matchSearch;
  });
}
function whatsappLink(order){
  var phone = (state.settings.adminPhone || "").replace(/[^0-9]/g, "");
  if (!phone || !order) return null;
  var lines = [
    "নতুন অর্ডার #" + order.id,
    "গ্রাহক: " + order.customerName,
    "ফোন: " + order.phone,
    "ঠিকানা: " + order.address,
    "",
    "পণ্যসমূহ:"
  ];
  order.items.forEach(function(i){ lines.push("- " + i.name + " x" + i.qty + " = " + taka(i.price*i.qty)); });
  lines.push("");
  lines.push("মোট মূল্য: " + taka(order.total));
  return "https://wa.me/" + phone + "?text=" + encodeURIComponent(lines.join("\n"));
}

/* ---------------- image helper (resize so it fits in browser storage) ---------------- */
function readImageSmall(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 600, w = img.width, h = img.height;
      if (w > max || h > max) { var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = function(){ cb(reader.result); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- actions ---------------- */
function setView(v){ state.view = v; render(); window.scrollTo(0,0); }
function setCategory(c){ state.activeCategory = c; render(); }
function onSearchInput(v){

  var scrollPos = window.scrollY;
  render();

  if (el) { el.focus(); var len = v.length; el.setSelectionRange(len, len); }

}
function toggleCart(){ state.cartOpen = !state.cartOpen; render(); }
function closeCart(){ state.cartOpen = false; render(); }
function toggleTheme(){ state.theme = state.theme === "dark" ? "light" : "dark"; save("theme", state.theme); render(); }
function goAdmin(){ setView(state.adminAuthed ? "admin" : "admin-login"); }

function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ state.toast = null; render(); }, 2200);
}

function addToCart(id){
  var p = state.products.find(function(x){ return x.id === id; });
  if (!p || p.stock <= 0) return;
  var cur = state.cart[id] || 0;
  if (cur >= p.stock) { showToast("স্টকে যতটুকু আছে তার বেশি যোগ করা যাবে না"); return; }
  state.cart[id] = cur + 1;
  save("cart", state.cart);
  showToast(p.name + " কার্টে যোগ হয়েছে");
}
function changeQty(id, delta){
  var p = state.products.find(function(x){ return x.id === id; });
  var cur = (state.cart[id] || 0) + delta;
  if (cur <= 0) { delete state.cart[id]; }
  else { if (p && cur > p.stock) cur = p.stock; state.cart[id] = cur; }
  save("cart", state.cart);
  render();
}
function removeFromCart(id){ delete state.cart[id]; save("cart", state.cart); render(); }

function normalizePhone(p){
  var bn = "০১২৩৪৫৬৭৮৯";
  p = String(p == null ? "" : p).replace(/[০-৯]/g, function(d){ return bn.indexOf(d); }).replace(/[\s\-()]/g, "");
  if (p.indexOf("+88") === 0) p = p.slice(3);
  else if (p.indexOf("88") === 0 && p.length === 13) p = p.slice(2);
  return p;
}
function isValidBdPhone(p){ return /^01[3-9][0-9]{8}$/.test(p); }
function submitCheckout(){
  var name = document.getElementById("coName").value.trim();
  var phone = normalizePhone(document.getElementById("coPhone").value);
  var address = document.getElementById("coAddress").value.trim();
  var errEl = document.getElementById("coError");
  var msg = "";
  if (!/^[\u0980-\u09FFA-Za-z][\u0980-\u09FFA-Za-z .'-]+$/.test(name)) msg = "অনুগ্রহ করে আপনার সঠিক নাম লিখুন।";
  else if (!isValidBdPhone(phone)) msg = "সঠিক মোবাইল নম্বর দিন (যেমন: 01712345678)। নাম বা ভুল নম্বর দিলে অর্ডার হবে না।";
  else if (address.length < 8) msg = "অনুগ্রহ করে সম্পূর্ণ ডেলিভারি ঠিকানা লিখুন।";
  if (msg) {
    if (errEl) { errEl.textContent = msg; errEl.style.display = "block"; }
    return;
  }
  var items = cartItemsList();
  var total = cartTotal();
  var order = {
    id: "ORD" + Date.now().toString().slice(-8),
    items: items.map(function(i){ return { id:i.id, name:i.name, price:i.price, qty:i.qty }; }),
    total: total,
    customerName: name,
    phone: phone,
    address: address,
    createdAt: new Date().toISOString(),
    status: "pending",
    history: [{ status: "pending", at: new Date().toISOString() }]
  };
  state.orders.unshift(order);
  save("orders", state.orders);
  state.products = state.products.map(function(p){
    var it = items.find(function(i){ return i.id === p.id; });
    return it ? Object.assign({}, p, { stock: Math.max(0, p.stock - it.qty) }) : p;
  });
  save("products", state.products);
  state.cart = {};
  save("cart", state.cart);
  state.lastOrderId = order.id;
  state.myOrders = [order.id].concat(state.myOrders).slice(0, 10);
  save("myorders", state.myOrders);
  setView("confirm");
}

function adminLoginSubmit(){
  var pw = document.getElementById("adminPw").value;

function resizeImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 600, w = img.width, h = img.height;
      if (w > max || h > max) { var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = function(){ cb(reader.result); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

}
function addProduct(){

    var el = document.getElementById("npName");

function cancelEditProduct(){ state.editingProductId = null; state.editProductImage = null; state.editDraft = null; render(); }
function onEditImageChange(input){

  resizeImage(file, function(data){
    var id = state.editingProductId, vals = {};

    state.editProductImage = data;
    render();
    if (id) keys.forEach(function(k){ var el = document.getElementById(k+id); if (el) el.value = vals[k]; });
  });

function saveEditProduct(id){
  var name = document.getElementById("epName-"+id).value.trim();
  var price = Number(document.getElementById("epPrice-"+id).value) || 0;
  var stock = Number(document.getElementById("epStock-"+id).value) || 0;
  state.products = state.products.map(function(p){
    if (p.id !== id) return p;
    var updated = Object.assign({}, p, { name: name || p.name, price:price, stock:stock });
    if (state.editProductImage) updated.image = state.editProductImage;
    return updated;
  });
  save("products", state.products);
  state.editingProductId = null;
  state.editProductImage = null;
  state.editDraft = null;
  render();
}

function renderProductCard(p){
  var cat = CAT_MAP[p.category];
  var qty = state.cart[p.id] || 0;
  var outOfStock = p.stock <= 0;
  var lowStock = !outOfStock && p.stock <= 5;
  var imgHtml = p.image ? '<img src="'+p.image+'" alt="">' : '<span class="cat-emoji" style="color:'+cat.color+'">'+cat.emoji+'</span>';
  var badge = outOfStock ? '<span class="stock-badge out">স্টক নেই</span>' : (lowStock ? '<span class="stock-badge low">মাত্র '+p.stock+' টি বাকি</span>' : '');
  var action;
  if (outOfStock) {
    action = '<button class="btn btn-disabled btn-block" disabled>স্টক নেই</button>';
  } else if (qty > 0) {
    action = '<div class="qty-control"><button class="qty-btn" onclick="changeQty(\''+p.id+'\',-1)">−</button><span>'+qty+'</span><button class="qty-btn primary" onclick="changeQty(\''+p.id+'\',1)">+</button></div>';
  } else {
    action = '<button class="btn btn-primary btn-block" onclick="addToCart(\''+p.id+'\')">কার্টে যোগ করুন</button>';
  }
  return (
    '<div class="product-card"><div class="notch"></div>' +
      '<div class="product-image-wrap"><div class="product-image" style="background:'+cat.color+'14;">'+imgHtml+'</div>'+badge+'</div>' +
      '<div class="product-name">'+escapeHtml(p.name)+'</div>' +
      '<div class="product-desc">'+escapeHtml(p.desc)+'</div>' +
      '<div class="price">'+taka(p.price)+'</div>' +

}

function openTrack(id){ state.trackOrderId = id; state.trackError = ""; setView("track"); }
function resetTrack(){ state.trackOrderId = null; state.trackError = ""; render(); }
function refreshTrack(){ state.orders = load("orders") || state.orders; showToast("সর্বশেষ অবস্থা আপডেট হয়েছে"); }
function doTrack(){
  var id = document.getElementById("trId").value.trim().toUpperCase().replace(/^#/, "").replace(/\s+/g, "");
  var phone = normalizePhone(document.getElementById("trPhone").value);
  var o = state.orders.find(function(x){ return x.id === id && normalizePhone(x.phone) === phone; });
  state.trackIdInput = id;
  if (!o) { state.trackError = "এই অর্ডার নম্বর ও ফোন নম্বরের সাথে কোনো অর্ডার পাওয়া যায়নি। নম্বর দুটো আবার মিলিয়ে দেখুন।"; state.trackOrderId = null; }
  else { state.trackError = ""; state.trackOrderId = o.id; }
  render();
}
function stepTime(o, key){
  if (key === "pending") return bnDate(o.createdAt);
  var h = (o.history || []).filter(function(x){ return x.status === key; });
  return h.length ? bnDate(h[h.length-1].at) : "";
}
function renderTimeline(o){
  if (o.status === "cancelled") {
    return '<div class="alert-error" style="margin:14px 0;font-weight:600;">❌ এই অর্ডারটি বাতিল করা হয়েছে। প্রয়োজনে যোগাযোগ করুন: ' + escapeHtml(state.settings.contactPhone) + '</div>';
  }
  var idx = TRACK_STEPS.findIndex(function(s){ return s.key === o.status; });
  if (idx < 0) idx = 0;
  return '<div class="timeline">' + TRACK_STEPS.map(function(s, i){
    var cls = i < idx ? "done" : (i === idx ? "done current" : "todo");
    var t = i <= idx ? stepTime(o, s.key) : "";
    return '<div class="tl-step ' + cls + '"><div class="tl-dot">' + (i <= idx ? "✓" : "") + '</div><div><div class="tl-label">' + s.label + '</div><div class="tl-sub">' + s.sub + (t ? ' • ' + t : '') + '</div></div></div>';
  }).join("") + '</div>';
}
function renderTrackView(){
  var order = state.trackOrderId ? state.orders.find(function(o){ return o.id === state.trackOrderId; }) : null;
  var body;
  if (order) {
    var items = order.items.map(function(i){
      return '<div class="summary-row"><span>' + escapeHtml(i.name) + ' × ' + i.qty + '</span><span>' + taka(i.price*i.qty) + '</span></div>';

    body =

        '<p class="hint" style="margin:0;">অর্ডারের সময়: ' + bnDate(order.createdAt) + '</p>' +
        renderTimeline(order) +
        '<h3>অর্ডার করা পণ্য</h3>' + items +

        return '<button class="btn btn-outline btn-block" style="justify-content:space-between;margin-bottom:8px;" onclick="openTrack(\'' + o.id + '\')"><span style="font-family:\'JetBrains Mono\',monospace;">#' + o.id + '</span><span>' + STATUS_LABELS[o.status] + '</span></button>';

    ) : "";

      '<div class="form-card"><label class="form-group">নতুন পাসওয়ার্ড (পরিবর্তন করতে চাইলে লিখুন)' +
        '<input id="setNewPassword" type="password" class="form-input" placeholder="••••••••"></label>' +
        '<p class="hint" style="color:var(--brick);">⚠️ এটি শুধু ডেমো/প্রোটোটাইপের জন্য সরল সুরক্ষা।</p></div>' +
      '<button class="btn btn-primary" onclick="saveSettings()">সংরক্ষণ করুন</button>' +
    '</div>'
  );
}
function renderAdminView(){
  if (!state.adminAuthed) return renderAdminLogin();
  if (state.adminTab === "orders") return renderOrdersTab();
  if (state.adminTab === "products") return renderProductsTab();
  return renderSettingsTab();
}

/* ---------------- footer ---------------- */
function renderFooter(){
  return (
    '<footer class="site-footer">' +
      '<p>যেকোনো প্রয়োজনে যোগাযোগ করুন: <strong>'+escapeHtml(state.settings.contactPhone)+'</strong></p>' +
      '<p>© OushodhGhor — বিশ্বস্ত অনলাইন মেডিসিন শপ</p>' +
    '</footer>'
  );
}

/* ---------------- main render ---------------- */
function render(){
  if (state.view === "admin" && state.adminTab === "products") {
    var g = function(id){ var el = document.getElementById(id); return el ? el.value : null; };
    if (state.showAddProduct && g("npName") !== null) {
      state.newProductDraft = { name:g("npName"), category:g("npCategory") || "fever", price:g("npPrice"), stock:g("npStock"), desc:g("npDesc") };
    }
    if (state.editingProductId && g("epName-"+state.editingProductId) !== null) {
      var eid = state.editingProductId;
      state.editDraft = { name:g("epName-"+eid), price:g("epPrice-"+eid), stock:g("epStock-"+eid) };
    }
  }
  document.documentElement.setAttribute("data-theme", state.theme);
  var isAdminView = state.view === "admin-login" || state.view === "admin";
  var html = "";
  html += isAdminView ? renderAdminHeader() : renderStoreHeader();
  html += '<main class="container main-content">';
  if (state.view === "store") html += renderStoreView();
  else if (state.view === "checkout") html += renderCheckoutView();
  else if (state.view === "confirm") html += renderConfirmView();
  else if (state.view === "track") html += renderTrackView();
  else if (state.view === "admin-login") html += renderAdminLogin();
  else if (state.view === "admin") html += renderAdminView();
  html += '</main>';
  if (!isAdminView) html += renderFooter();
  html += renderCartDrawer();
  if (state.toast) html += '<div class="toast">'+escapeHtml(state.toast)+'</div>';
  document.getElementById("app").innerHTML = html;
}

window.addEventListener("storage", function(e){
  if (!e.key || e.key.indexOf("oushodhghor_") !== 0) return;
  state.orders = load("orders") || state.orders;
  state.products = load("products") || state.products;
  if ((state.view === "track" && state.trackOrderId) || (state.view === "admin" && state.adminTab === "orders")) render();
});
document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
